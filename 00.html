<!-- SAGODENT MENU HTML — MOBILE LANGUAGE DROPDOWN -->
<main id="--sgd-top" aria-label="Điều hướng Sagodent">
    <div class="--sgd-scroll-progress" aria-hidden="true"></div>
    <header class="--sgd-topbar">
        <a class="--sgd-sagodent-logo" href="#--sgd-top" aria-label="Về đầu trang Sagodent"> <span
                class="--sgd-logo-swap"> <img class="--sgd-logo-white"
                    src="http://sagodent.com/wp-content/uploads/2026/08/logo-white.png"
                    alt="Sagodent - Dental education center"> <img class="--sgd-logo-blue"
                    src="http://sagodent.com/wp-content/uploads/2026/08/logo-blu-01.png"
                    alt="Sagodent - Dental education center"> </span> </a>
        <div class="--sgd-header-actions">
            <!-- Link English gốc: desktop/tablet giữ nguyên. Mobile chỉ ẩn chữ ENG bằng CSS. -->
            <a class="--sgd-language --sgd-language-link" href="#" aria-label="English"> <img class="--sgd-flag-us"
                    src="https://sagodent.com/wp-content/uploads/2026/09/1788493537780_1387843300402958155_1387843300402958155_6813b47d7cb216dce427a6d065133787.jpg"
                    alt="English"> <span class="--sgd-language-label">ENG</span> </a>
            <!-- CHỈ hiện trên điện thoại <= 600px. --><button class="--sgd-language-toggle" type="button"
                aria-label="Chọn ngôn ngữ" aria-expanded="false" aria-controls="--sgd-language-dropdown"> <span
                    aria-hidden="true"></span> </button>
            <!-- CHỈ hiện trên điện thoại khi bấm mũi tên. -->
            <div class="--sgd-language-dropdown" id="--sgd-language-dropdown" aria-hidden="true">
                <a class="--sgd-language-option --sgd-language-option-vn" href="#" aria-label="Tiếng Việt"> <img
                        class="--sgd-flag-vn"
                        src="https://sagodent.com/wp-content/uploads/2026/09/1788493543944_1387843300402958155_1387843300402958155_af10ec38ece6559846e52ee055d77457.jpg"
                        alt="Tiếng Việt"> </a>
            </div> <button class="--sgd-menu-button" type="button" aria-expanded="false"
                aria-controls="--sgd-sagodent-main-menu-panel"> MỤC CHÍNH <span aria-hidden="true">III</span> </button>
        </div>
    </header>
    <nav class="--sgd-menu-panel" id="--sgd-sagodent-main-menu-panel" aria-label="Mục chính" aria-hidden="true"> <a
            href="#intro"><small>01</small>GIỚI THIỆU<span aria-hidden="true">↗</span></a> <a
            href="#courses"><small>02</small>KHÓA HỌC<span aria-hidden="true">↗</span></a> <a
            href="#library"><small>03</small>THƯ VIỆN<span aria-hidden="true">↗</span></a>
        <a href="#id4"><small>04</small>NHA KHOA ID-4<span aria-hidden="true">↗</span></a> <a
            href="#contact"><small>05</small>LIÊN HỆ<span aria-hidden="true">↗</span></a>
    </nav>
</main>
